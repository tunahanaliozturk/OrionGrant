<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="600" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionGrant - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">ASP.NET Core endpoints go through OrionGrant.AspNetCore; any other code injects IGrantAuthorizer from the core package.</text>

  <!-- app -->
  <rect class="step" x="40" y="104" width="1130" height="64" rx="14"/>
  <text class="label" x="605" y="131" text-anchor="middle">Your app</text>
  <text class="small" x="605" y="152" text-anchor="middle">builds a GrantPrincipal (Subject, Roles, Permissions, Denies) from claims, an API key or a session</text>

  <path class="flow" d="M310,168 L310,228"/>
  <text class="code" x="322" y="203" style="font-variant-ligatures: none">[Authorize(Policy = "perm:...")]</text>
  <path class="flow" d="M895,168 L895,228"/>
  <text class="code" x="907" y="203" style="font-variant-ligatures: none">IGrantAuthorizer.Authorize(...)</text>

  <!-- AspNetCore package -->
  <rect class="step" x="40" y="230" width="540" height="220" rx="14"/>
  <text class="label" x="310" y="262" text-anchor="middle">OrionGrant.AspNetCore</text>
  <text class="code" x="310" y="290" text-anchor="middle" style="font-variant-ligatures: none">services.AddOrionGrantAuthorization(grant =&gt; ...)</text>
  <text class="small" x="64" y="322">OrionGrantPolicyProvider: "perm:" and "policy:" policy names</text>
  <text class="small" x="64" y="346">RequirePermission / RequirePolicy on AuthorizationPolicyBuilder</text>
  <text class="small" x="64" y="370">OrionGrantAuthorizationHandler checks each OrionGrantRequirement</text>
  <text class="small" x="64" y="394">IGrantPrincipalResolver: ClaimsGrantPrincipalResolver by default</text>
  <text class="small" x="64" y="418">a denial fails with OrionGrantAuthorizationFailureReason</text>

  <path class="flow" d="M580,340 L618,340"/>
  <text class="edge" x="599" y="330" text-anchor="middle">calls</text>

  <!-- core package -->
  <rect class="step" x="620" y="230" width="550" height="220" rx="14"/>
  <text class="label" x="895" y="262" text-anchor="middle">OrionGrant</text>
  <text class="code" x="895" y="290" text-anchor="middle" style="font-variant-ligatures: none">services.AddOrionGrant(grant =&gt; ...)</text>
  <text class="small" x="644" y="322">OrionGrantBuilder: AddRole, IncludeRole, AddPolicy, UseEffectiveSetCache</text>
  <text class="small" x="644" y="346">RoleRegistry, PolicyRegistry: immutable, built once at registration</text>
  <text class="small" x="644" y="370">GrantAuthorizer : IGrantAuthorizer, wildcards via PermissionMatcher</text>
  <text class="small" x="644" y="394">IEffectiveGrantCache: opt-in per-principal effective-set cache</text>
  <text class="small" x="644" y="418">GrantDiagnostics: meter Moongazing.OrionGrant</text>

  <!-- dependencies -->
  <path class="flow" d="M310,450 L310,488"/>
  <text class="edge" x="322" y="474">builds on</text>
  <rect class="ext" x="40" y="490" width="540" height="80" rx="14"/>
  <text class="label" x="310" y="522" text-anchor="middle">Microsoft.AspNetCore.App (shared framework)</text>
  <text class="small" x="310" y="546" text-anchor="middle">IAuthorizationService, IAuthorizationPolicyProvider, IAuthorizationHandler</text>

  <path class="flow" d="M895,450 L895,488"/>
  <text class="edge" x="907" y="474">depends on</text>
  <rect class="ext" x="620" y="490" width="550" height="80" rx="14"/>
  <text class="label" x="895" y="522" text-anchor="middle">Orion.Abstractions</text>
  <text class="small" x="895" y="546" text-anchor="middle">OrionInstrumentation and OrionTelemetry names; plus DependencyInjection.Abstractions</text>
</svg>
