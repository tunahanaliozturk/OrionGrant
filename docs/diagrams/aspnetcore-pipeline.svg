<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="860" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionGrant.AspNetCore - from [Authorize] to a decision</text>
  <text class="subtitle" x="40" y="78">OrionGrantAuthorizationHandler resolves the user to a GrantPrincipal and runs the matching IGrantAuthorizer check.</text>

  <!-- start -->
  <rect class="step" x="40" y="235" width="230" height="90" rx="14"/>
  <text class="code" x="155" y="266" text-anchor="middle">[Authorize(Policy =</text>
  <text class="code" x="155" y="286" text-anchor="middle">"perm:orders:read")]</text>
  <text class="small" x="155" y="308" text-anchor="middle">or RequirePermission(...)</text>

  <path class="flow" d="M270,280 L298,280"/>

  <!-- provider -->
  <rect class="step" x="300" y="235" width="230" height="90" rx="14"/>
  <text class="label" x="415" y="260" text-anchor="middle">OrionGrantPolicyProvider</text>
  <text class="small" x="415" y="282" text-anchor="middle">"perm:x" to ForPermission(x)</text>
  <text class="small" x="415" y="302" text-anchor="middle">"policy:x" to ForPolicy(x)</text>

  <path class="flow" d="M530,280 L568,280"/>

  <!-- resolve decision -->
  <polygon class="decision" points="660,220 750,280 660,340 570,280"/>
  <text class="label" x="660" y="276" text-anchor="middle">principal</text>
  <text class="label" x="660" y="296" text-anchor="middle">resolved?</text>

  <path class="flow alt" d="M660,220 L660,192"/>
  <text class="edge" x="670" y="212">null</text>
  <rect class="fail" x="560" y="110" width="200" height="80" rx="14"/>
  <text class="code" x="660" y="140" text-anchor="middle">context.Fail</text>
  <text class="small" x="660" y="162" text-anchor="middle">not authenticated or</text>
  <text class="small" x="660" y="180" text-anchor="middle">no subject claim</text>

  <path class="flow" d="M750,280 L808,280"/>
  <text class="edge" x="779" y="270" text-anchor="middle">yes</text>

  <!-- resource decision -->
  <polygon class="decision" points="900,220 990,280 900,340 810,280"/>
  <text class="label" x="900" y="276" text-anchor="middle">resource</text>
  <text class="label" x="900" y="296" text-anchor="middle">supported?</text>

  <path class="flow alt" d="M900,220 L900,192"/>
  <text class="edge" x="910" y="212">no</text>
  <rect class="fail" x="800" y="110" width="200" height="80" rx="14"/>
  <text class="code" x="900" y="140" text-anchor="middle">context.Fail</text>
  <text class="small" x="900" y="162" text-anchor="middle">unknown resource type</text>
  <text class="small" x="900" y="180" text-anchor="middle">(fail closed)</text>

  <path class="flow" d="M900,340 L900,418"/>
  <text class="edge" x="910" y="384">yes</text>

  <!-- authorizer -->
  <rect class="step" x="790" y="420" width="220" height="90" rx="14"/>
  <text class="label" x="900" y="446" text-anchor="middle">IGrantAuthorizer</text>
  <text class="code" x="900" y="470" text-anchor="middle" style="font-variant-ligatures: none">Authorize(...)</text>
  <text class="code" x="900" y="492" text-anchor="middle" style="font-variant-ligatures: none">AuthorizePolicy(...)</text>

  <path class="flow" d="M900,510 L900,578"/>

  <!-- granted decision -->
  <polygon class="decision" points="900,580 990,640 900,700 810,640"/>
  <text class="label" x="900" y="645" text-anchor="middle">granted?</text>

  <path class="flow" d="M990,640 L1018,640"/>
  <text class="edge" x="1004" y="630" text-anchor="middle">yes</text>
  <rect class="ok" x="1020" y="605" width="150" height="70" rx="14"/>
  <text class="code" x="1095" y="645" text-anchor="middle">context.Succeed</text>

  <path class="flow alt" d="M900,700 L900,738"/>
  <text class="edge" x="910" y="724">no</text>
  <rect class="fail" x="720" y="740" width="360" height="80" rx="14"/>
  <text class="code" x="900" y="770" text-anchor="middle">context.Fail(</text>
  <text class="code" x="900" y="790" text-anchor="middle">OrionGrantAuthorizationFailureReason)</text>
  <text class="small" x="900" y="810" text-anchor="middle">carries the AuthorizationResult and its DenialReason</text>

  <!-- notes -->
  <rect class="note" x="40" y="420" width="700" height="120" rx="10"/>
  <text class="label" x="60" y="448">ClaimsGrantPrincipalResolver (default IGrantPrincipalResolver)</text>
  <text class="small" x="60" y="474">Claim types from OrionGrantClaimsOptions: SubjectClaimType ClaimTypes.NameIdentifier, with "sub"</text>
  <text class="small" x="60" y="494">as fallback; RoleClaimType ClaimTypes.Role; PermissionClaimType "permission"; DenyClaimType "deny".</text>
  <text class="small" x="60" y="518">Register your own IGrantPrincipalResolver first to load grants from somewhere else.</text>

  <rect class="note" x="40" y="570" width="660" height="140" rx="10"/>
  <text class="label" x="60" y="598">The resource passed to IAuthorizationService.AuthorizeAsync</text>
  <text class="small" x="60" y="624">null: the plain permission or policy check.</text>
  <text class="small" x="60" y="646">OrionGrantResource or ResourceContext: the owner-or-elevated permission check; for a policy,</text>
  <text class="small" x="60" y="666">the resource reaches the condition as AuthorizationAttributes.Resource.</text>
  <text class="small" x="60" y="690">Any other type: denied, never silently ignored.</text>
</svg>
