<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="850" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionGrant - permission check</text>
  <text class="subtitle" x="40" y="78">Authorize(principal, permission): a deny beats any allow; the resource overload adds the owner-or-elevated rule on top.</text>

  <!-- start -->
  <rect class="step" x="40" y="215" width="220" height="90" rx="14"/>
  <text class="code" x="150" y="246" text-anchor="middle">Authorize(principal,</text>
  <text class="code" x="150" y="266" text-anchor="middle">permission)</text>
  <text class="small" x="150" y="288" text-anchor="middle">optionally + ResourceContext</text>

  <path class="flow" d="M260,260 L298,260"/>

  <!-- effective set -->
  <rect class="step" x="300" y="215" width="250" height="90" rx="14"/>
  <text class="label" x="425" y="242" text-anchor="middle">Effective grant set</text>
  <text class="small" x="425" y="264" text-anchor="middle">Permissions + expanded Roles</text>
  <text class="small" x="425" y="284" text-anchor="middle">plus Denies; cached when enabled</text>

  <path class="flow" d="M550,260 L588,260"/>

  <!-- deny decision -->
  <polygon class="decision" points="680,200 770,260 680,320 590,260"/>
  <text class="label" x="680" y="256" text-anchor="middle">deny</text>
  <text class="label" x="680" y="276" text-anchor="middle">matches?</text>

  <path class="flow alt" d="M680,200 L680,172"/>
  <text class="edge" x="690" y="192">yes</text>
  <rect class="fail" x="590" y="104" width="180" height="66" rx="14"/>
  <text class="label" x="680" y="130" text-anchor="middle">Denied</text>
  <text class="code" x="680" y="152" text-anchor="middle">ExplicitDeny</text>

  <path class="flow" d="M770,260 L818,260"/>
  <text class="edge" x="794" y="250" text-anchor="middle">no</text>

  <!-- allow decision -->
  <polygon class="decision" points="910,200 1000,260 910,320 820,260"/>
  <text class="label" x="910" y="256" text-anchor="middle">allow</text>
  <text class="label" x="910" y="276" text-anchor="middle">matches?</text>

  <path class="flow alt" d="M910,200 L910,172"/>
  <text class="edge" x="920" y="192">no</text>
  <rect class="fail" x="820" y="104" width="180" height="66" rx="14"/>
  <text class="label" x="910" y="130" text-anchor="middle">Denied</text>
  <text class="code" x="910" y="152" text-anchor="middle">MissingPermission</text>

  <path class="flow" d="M1000,260 L1038,260"/>
  <text class="edge" x="1019" y="250" text-anchor="middle">yes</text>
  <rect class="ok" x="1040" y="215" width="130" height="90" rx="14"/>
  <text class="label" x="1105" y="254" text-anchor="middle">Granted</text>
  <text class="small" x="1105" y="276" text-anchor="middle">no resource given</text>

  <!-- resource path -->
  <path class="flow" d="M910,320 L910,418"/>
  <text class="edge" x="898" y="374" text-anchor="end">yes, resource overload</text>

  <polygon class="decision" points="910,420 1000,480 910,540 820,480"/>
  <text class="label" x="910" y="485" text-anchor="middle">elevated?</text>

  <path class="flow" d="M1000,480 L1038,480"/>
  <text class="edge" x="1019" y="470" text-anchor="middle">yes</text>
  <rect class="ok" x="1040" y="435" width="130" height="90" rx="14"/>
  <text class="label" x="1105" y="476" text-anchor="middle">Granted</text>
  <text class="small" x="1105" y="498" text-anchor="middle">ownership bypassed</text>

  <path class="flow" d="M910,540 L910,598"/>
  <text class="edge" x="920" y="574">no</text>

  <polygon class="decision" points="910,600 1000,660 910,720 820,660"/>
  <text class="label" x="910" y="665" text-anchor="middle">owner?</text>

  <path class="flow" d="M1000,660 L1038,660"/>
  <text class="edge" x="1019" y="650" text-anchor="middle">yes</text>
  <rect class="ok" x="1040" y="615" width="130" height="90" rx="14"/>
  <text class="label" x="1105" y="665" text-anchor="middle">Granted</text>

  <path class="flow alt" d="M910,720 L910,758"/>
  <text class="edge" x="920" y="744">no</text>
  <rect class="fail" x="810" y="760" width="200" height="60" rx="14"/>
  <text class="label" x="910" y="784" text-anchor="middle">Denied</text>
  <text class="code" x="910" y="806" text-anchor="middle">ResourceOwnership</text>

  <!-- notes -->
  <rect class="note" x="40" y="420" width="740" height="150" rx="10"/>
  <text class="label" x="60" y="448">Resource overload: Authorize(principal, permission, resource, options)</text>
  <text class="small" x="60" y="474">The permission is a hard gate: without it, owning the resource does not help (the IDOR fix).</text>
  <text class="small" x="60" y="496">Elevated: the principal holds the root * grant (TreatRootWildcardAsElevated, default true) or</text>
  <text class="small" x="60" y="516">matches an entry of ElevatedPermissions; an elevated grant that is itself denied does not count.</text>
  <text class="small" x="60" y="542">Owner: ResourceContext.OwnerId equals GrantPrincipal.Subject, compared with OwnerComparison (Ordinal).</text>

  <rect class="note" x="40" y="600" width="740" height="120" rx="10"/>
  <text class="label" x="60" y="628">Every check returns an AuthorizationResult and never throws for a denial</text>
  <text class="small" x="60" y="654">A denial carries FailureReason (text for a log line or a 403 body) and Denial, a DenialReason with its DenialKind.</text>
  <text class="small" x="60" y="676">Each decision adds 1 to orion.grant.decisions, tagged orion.outcome and kind (permission or resource).</text>
  <text class="small" x="60" y="698">AuthorizeAll checks many permissions and expands the effective set once for the whole batch.</text>
</svg>
